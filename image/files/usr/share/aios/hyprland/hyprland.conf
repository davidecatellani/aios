# Il compositore di AIOS: Hyprland, senza interfaccia sua. La shell di AIOS (aios-shell) disegna la
# giornata, la barra e Nova; ogni programma si apre a tutto schermo sul suo spazio di lavoro (lo
# sposta la shell), e passare da un programma all'altro scorre con un'animazione.
# L'utente può aggiungere le sue righe in ~/.config/aios/hyprland.conf (letto per ultimo).
# aios-sessione ne fa una copia di lavoro in $XDG_RUNTIME_DIR/aios-hyprland (@RUN@ = quella cartella).

monitor = , preferred, auto, 1

# la tastiera scelta (Impostazioni › Tastiera): la scrive aios-sessione, la cambia «hyprctl keyword»
source = @RUN@/tastiera.conf

input {
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(00000066)
    }
    blur {
        enabled = true
        size = 10
        passes = 2
        vibrancy = 0.2
    }
}

# animazioni morbide: i programmi entrano ed escono «a bolla», gli spazi scorrono, Nova sfuma
animations {
    enabled = true
    bezier = aios, 0.22, 1, 0.36, 1
    bezier = aiosEsce, 0.4, 0, 1, 1
    animation = windows, 1, 5, aios, popin 88%
    animation = windowsOut, 1, 3, aiosEsce, popin 88%
    animation = windowsMove, 1, 5, aios
    animation = fade, 1, 4, aios
    animation = layers, 1, 4, aios, fade
    animation = workspaces, 1, 6, aios, slidefade 12%
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x0b1220
    focus_on_activate = true
    animate_manual_resizes = true
}

# niente avvisi e notizie di Hyprland: AIOS non mostra niente che non sia suo
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# avvio della sessione: notifiche, blocco schermo, la shell
exec-once = /usr/libexec/aios-avvio-sessione

# Super: la giornata; Super+Spazio (o Super+A): Nova sopra qualsiasi programma
bindr = SUPER, SUPER_L, exec, aios-shell --casa
bind = SUPER, space, exec, aios-shell --nova
bind = SUPER, A, exec, aios-shell --nova
# cronologia degli appunti ed emoji, sopra qualsiasi programma (la scelta si incolla da sola)
bind = SUPER, V, exec, aios-shell --appunti
bind = SUPER, period, exec, aios-shell --emoji
bind = SUPER, N, exec, aios-shell --notifiche
layerrule = blur, aios-pannello
layerrule = ignorezero, aios-pannello
bind = ALT, Tab, workspace, m+1
bind = ALT SHIFT, Tab, workspace, m-1
bind = SUPER, right, workspace, m+1
bind = SUPER, left, workspace, m-1
bind = ALT, F4, killactive
bind = SUPER, Q, killactive
bind = SUPER, L, exec, aios-blocca
# terminale nascosto, per l'assistenza (non compare tra le app)
bind = CTRL ALT, T, exec, sh -c 'ptyxis || gnome-terminal || foot'
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , Print, exec, aios-schermata
bind = SHIFT, Print, exec, aios-schermata area
# schermi, mouse e tastiera, accessibilità (Impostazioni di AIOS), poi le righe dell'utente
source = @RUN@/sistema.conf
source = @RUN@/utente.conf
