# Microfono di Nova senza eco e senza rumori: toglie dal microfono quello che suonano gli altoparlanti
# (un film, la musica, la voce di Nova stessa) e riduce i rumori di fondo. Lo usa voice.py (aios_mic_pulito).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      node.latency = 1024/48000
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.extended_filter = true
        webrtc.gain_control = true
        webrtc.high_pass_filter = true
      }
      capture.props = { node.name = "aios_ec_capture" node.passive = true }
      source.props = { node.name = "aios_mic_pulito" node.description = "Microfono (senza eco e rumori)" }
      sink.props = { node.name = "aios_ec_sink" }
      playback.props = { node.name = "aios_ec_playback" node.passive = true }
    }
  }
]
