[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-copilot"
version = "0.1.0"
description = "Copilota AI locale di AIOS: gestisci il sistema in lingua naturale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Nessuna dipendenza obbligatoria: la finestra grafica usa PyGObject/GTK4 di sistema.
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.46"]
test = ["pytest>=8"]

[project.scripts]
aios-copilot = "aios_copilot.__main__:main"

[tool.setuptools.packages.find]
include = ["aios_copilot*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
