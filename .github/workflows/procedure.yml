name: Prova procedure

# La misura delle procedure (docs/PROCEDURE.md): lo stesso lavoro tutto in un prompt oppure a fasi (ICM), con lo
# stesso modello locale su CPU, gli stessi dati e la stessa calcolatrice (copilot/addestramento/procedure_prova.py).
# Un lavoro per compito in parallelo; alla fine una Release «procedure-N» con la tabella. Si avvia solo a mano.
on:
  workflow_dispatch:
    inputs:
      modello:
        description: "Modello Ollama"
        default: "qwen3.5:4b"
      quante:
        description: "Lavori diversi per compito"
        default: "4"
      compiti:
        description: "Compiti separati da virgola"
        default: "spese,posta,preventivo,posta_lunga"

permissions:
  contents: write

jobs:
  elenco:
    runs-on: ubuntu-24.04
    outputs:
      compiti: ${{ steps.c.outputs.compiti }}
    steps:
      - id: c
        env:
          COMPITI: ${{ inputs.compiti }}
        run: echo "compiti=$(python3 -c "import json,os; print(json.dumps([c.strip() for c in os.environ['COMPITI'].split(',') if c.strip()]))")" >> "$GITHUB_OUTPUT"

  prova:
    needs: elenco
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        compito: ${{ fromJson(needs.elenco.outputs.compiti) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti
        env:
          MODELLO: ${{ inputs.modello }}
        run: |
          pip install -e copilot
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          (OLLAMA_NUM_PARALLEL=1 ollama serve > ollama.log 2>&1 &)
          for i in $(seq 30); do curl -sf localhost:11434/api/version && break; sleep 1; done
          ollama pull "$MODELLO"
      - name: Misura
        env:
          MODELLO: ${{ inputs.modello }}
          QUANTE: ${{ inputs.quante }}
          COMPITO: ${{ matrix.compito }}
        run: |
          python copilot/addestramento/procedure_prova.py --modello "$MODELLO" --compiti "$COMPITO" --quante "$QUANTE" \
            --uscita "procedure-$COMPITO.json" | tee "procedure-$COMPITO.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procedure-${{ matrix.compito }}
          path: |
            procedure-${{ matrix.compito }}.json
            procedure-${{ matrix.compito }}.txt

  tabella:
    needs: prova
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: risultati
      - name: Pubblica
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELLO: ${{ inputs.modello }}
        run: |
          python3 - <<'PY' > tabella.md
          import glob, json, os, sys
          sys.path.insert(0, "copilot/addestramento")
          from procedure_prova import table
          rows = [r for f in sorted(glob.glob("risultati/*/*.json")) for r in json.load(open(f))["risultati"]]
          print(f"Modello: {os.environ['MODELLO']} (CPU, Ollama). «unico» = tutto in un prompt; «fasi» = procedura ICM.\n")
          print(table(rows))
          print("\nControlli sbagliati per lavoro:\n")
          for r in rows:
              bad = [c for c, ok in r["controlli"] if not ok]
              if bad or r["errore"]:
                  print(f"- {r['compito']} {r['lavoro']} {r['modo']}: " + "; ".join(bad) + (f" (errore: {r['errore'][:150]})" if r["errore"] else ""))
          PY
          cat tabella.md >> "$GITHUB_STEP_SUMMARY"
          tag="procedure-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --title "Prova procedure ${GITHUB_RUN_NUMBER}" \
            --notes-file tabella.md risultati/*/*.json risultati/*/*.txt
