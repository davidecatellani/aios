name: Prova Sibilia

# Sibilia-TTS (DeepMount00, Apache 2.0): Sesame CSM-1B affinato per l'italiano, circa 2 miliardi di parametri.
# Le stesse frasi di Nova con Kokoro (la voce di adesso: Sara e Nicola) e con Sibilia (due voci), su un processore
# senza scheda video (il runner di GitHub), con il tempo di ognuna rispetto alla durata dell'audio. I file audio
# vanno nel ramo «prova-sibilia», da ascoltare. Non tocca l'immagine di SoIA. Si avvia solo a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voci:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparazione
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          mkdir -p ~/voci
          { echo "Processore: $(nproc) core,$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2), memoria $(free -g | awk '/Mem/{print $2}') GB"; echo; } > ~/voci/tempi.txt
          cat > ~/voci/frasi.txt <<'EOF'
          Buongiorno! Oggi hai due impegni: la riunione alle dieci e la palestra alle sei. Vuoi che ti ricordi qualcosa?
          Ho trovato tre bollette della luce: luglio 84,20 euro, agosto 91,10 euro e settembre 78,50 euro. In media spendi 84,60 euro al mese.
          Marco Rossi ti ha scritto: chiede se domani alle undici riuscite a vedervi al bar sotto l'ufficio. Gli rispondo di sì?
          EOF
          sed -i 's/^ *//' ~/voci/frasi.txt
      - uses: actions/checkout@v4
        with:
          path: aios
      - name: Numeri in parole (come le legge Nova, aios_copilot/parlato.py)
        run: |
          cd ~/voci && cp frasi.txt frasi-originali.txt
          PYTHONPATH="$GITHUB_WORKSPACE/aios/copilot" python3 -c "
          from aios_copilot.voice import for_speech
          righe = [r.strip() for r in open('frasi-originali.txt') if r.strip()]
          open('frasi.txt', 'w').write(''.join(for_speech(r) + '\\n' for r in righe))"
          cat frasi.txt
      - name: Kokoro (Sara, Nicola), la voce di adesso
        continue-on-error: true
        run: |
          python3 -m venv /tmp/ko && . /tmp/ko/bin/activate
          pip install -q kokoro-onnx soundfile
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL -o /tmp/kokoro.onnx "$base/kokoro-v1.0.int8.onnx"
          curl -fsSL -o /tmp/voices.bin "$base/voices-v1.0.bin"
          cd ~/voci
          python3 - <<'PY'
          import time, soundfile as sf
          from kokoro_onnx import Kokoro
          k = Kokoro("/tmp/kokoro.onnx", "/tmp/voices.bin")
          frasi = [f.strip() for f in open("frasi.txt") if f.strip()]
          for voce in ("if_sara", "im_nicola"):
              for i, frase in enumerate(frasi, 1):
                  t = time.time()
                  audio, sr = k.create(frase, voice=voce, speed=1.0, lang="it")
                  spent, dur = time.time() - t, len(audio) / sr
                  sf.write(f"kokoro-{voce.split('_')[1]}-frase{i}.wav", audio, sr)
                  open("tempi.txt", "a").write(f"kokoro {voce} frase {i}: {spent:.1f} s per {dur:.1f} s di audio ({spent / dur:.2f}× il tempo reale)\n")
          PY
      - name: Sibilia-TTS
        continue-on-error: true
        run: |
          rm -rf /tmp/ko ~/.cache/pip
          python3 -m venv /tmp/si && . /tmp/si/bin/activate
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.52" accelerate soundfile
          cd ~/voci
          python3 - <<'PY'
          import os, time, torch, soundfile as sf
          from transformers import AutoProcessor, CsmForConditionalGeneration
          torch.set_num_threads(os.cpu_count())
          t = time.time()
          repo = "DeepMount00/Sibilia-TTS"
          processor = AutoProcessor.from_pretrained(repo)
          model = CsmForConditionalGeneration.from_pretrained(repo, torch_dtype=torch.float32)
          model.eval()
          open("tempi.txt", "a").write(f"\nsibilia: caricato in {time.time() - t:.0f} s (scaricamento compreso)\n")
          frasi = [f.strip() for f in open("frasi.txt") if f.strip()]
          for voce in ("0", "1"):
              for i, frase in enumerate(frasi, 1):
                  conv = [{"role": voce, "content": [{"type": "text", "text": frase}]}]
                  inputs = processor.apply_chat_template(conv, tokenize=True, return_dict=True)
                  t = time.time()
                  with torch.inference_mode():
                      audio = model.generate(**inputs, output_audio=True, max_new_tokens=320, depth_decoder_do_sample=True)
                  spent = time.time() - t
                  name = f"sibilia-voce{voce}-frase{i}.wav"
                  processor.save_audio(audio, name)
                  dur = sf.info(name).duration
                  open("tempi.txt", "a").write(f"sibilia voce {voce} frase {i}: {spent:.1f} s per {dur:.1f} s di audio ({spent / max(dur, 0.1):.2f}× il tempo reale)\n")
                  print(name, spent, dur, flush=True)
          PY
      - name: Nel ramo prova-sibilia
        if: always()
        run: |
          cd ~/voci
          { echo; echo "Frasi scritte:"; cat frasi-originali.txt; echo; echo "Frasi lette (numeri in parole):"; cat frasi.txt; } >> tempi.txt; cat tempi.txt; ls -la
          git init -q -b prova-sibilia && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Prova di Sibilia-TTS contro Kokoro"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" prova-sibilia
