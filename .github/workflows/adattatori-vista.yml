name: Vista del nucleo

# Gli occhi di Nova: il proiettore delle immagini di Qwen3.5 0.8B (mmproj.gguf) e l'adattatore «documenti»
# (legge bollette, scontrini, avvisi di pagamento), addestrato su documenti finti disegnati al momento
# (copilot/addestramento/documenti.py). Parte dall'ultima Release «adattatori-…» (modello base, smistamento,
# campi), misura tutto e pubblica una nuova Release «adattatori-vista-N» completa: la costruzione
# dell'immagine prende la più recente. Si avvia solo a mano.
on:
  workflow_dispatch:
    inputs:
      minuti:
        description: "Tempo massimo di addestramento (minuti, senza scheda video)"
        default: "150"
      documenti:
        description: "Quanti documenti finti disegnare"
        default: "700"

permissions:
  contents: write

env:
  BASE: Qwen/Qwen3.5-0.8B
  LLAMA_CPP: b11392  # stessa versione dell'immagine (image/Containerfile)

jobs:
  vista:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti
        run: |
          sudo apt-get install -y -q fonts-dejavu-core fonts-liberation
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install "transformers>=5" peft accelerate sentencepiece safetensors huggingface_hub pillow
          pip install -e copilot
          git clone --depth 1 --branch "$LLAMA_CPP" https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          pip install /tmp/llama.cpp/gguf-py
          curl -fsSL -o /tmp/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_CPP/llama-$LLAMA_CPP-bin-ubuntu-x64.tar.gz"
          mkdir -p /tmp/llama-bin && tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          echo "SERVER=$(find /tmp/llama-bin -name llama-server -type f | head -n1)" >> "$GITHUB_ENV"
      - name: Adattatori di testo già pubblicati
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | startswith("adattatori-"))] | sort_by(.createdAt) | reverse | .[0].tagName')
          echo "Parto da $tag"
          mkdir -p uscita
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir uscita --pattern 'base.gguf' \
            --pattern 'smistamento.gguf' --pattern 'campi.gguf' --pattern 'schermate.gguf'  # «schermate» si tiene
          ls -lh uscita
      - name: Modello base e proiettore delle immagini
        run: |
          huggingface-cli download "$BASE" --local-dir base-hf || hf download "$BASE" --local-dir base-hf
          python /tmp/llama.cpp/convert_hf_to_gguf.py base-hf --mmproj --outtype f16 --outfile uscita/mmproj.gguf
          ls -lh uscita
      - name: Documenti finti
        run: |
          python copilot/addestramento/documenti.py --uscita dati-documenti --quanti "${{ inputs.documenti }}"
          python copilot/addestramento/dati.py --uscita dati
      - name: Adattatore documenti
        run: |
          python copilot/addestramento/addestra_documenti.py --base base-hf --dati dati-documenti \
            --uscita lora/documenti --max-minuti "${{ inputs.minuti }}"
      - name: Conversione in GGUF
        run: |
          python /tmp/llama.cpp/convert_lora_to_gguf.py --base base-hf --outtype f16 --outfile uscita/documenti.gguf lora/documenti
          ls -lh uscita
      - name: Misura
        run: |
          chmod +x "$SERVER"
          LD_LIBRARY_PATH="$(dirname "$SERVER")" "$SERVER" -m uscita/base.gguf --mmproj uscita/mmproj.gguf \
            --lora uscita/smistamento.gguf --lora uscita/campi.gguf --lora uscita/documenti.gguf \
            --lora-init-without-apply --port 11436 -c 4096 -np 1 > server.log 2>&1 &
          for i in $(seq 90); do curl -sf http://127.0.0.1:11436/health && break; sleep 2; done
          set -o pipefail
          tail -n 5 server.log
          { echo "### Documenti" && echo && python copilot/addestramento/valuta_documenti.py --dati dati-documenti \
              --url http://127.0.0.1:11436 && echo && echo "### Smistamento e campi (con il terzo adattatore accanto)" && echo &&
            python copilot/addestramento/valuta.py --dati dati --url http://127.0.0.1:11436; } | tee uscita/misura.md
      - name: Pubblica
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd uscita && sha256sum *.gguf > SHA256SUMS
          tag="adattatori-vista-${GITHUB_RUN_NUMBER}"
          { echo "Nucleo di Nova su $BASE (llama.cpp $LLAMA_CPP): smistamento, campi, documenti e proiettore delle immagini."; echo; cat misura.md; } > note.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --title "Vista del nucleo ${GITHUB_RUN_NUMBER}" \
            --notes-file note.md *.gguf misura.md SHA256SUMS
