name: Immagine AIOS

# Costruisce l'immagine AIOS per PC (image/Containerfile) e la mette in una Release «anteprima»:
# - sempre il pacchetto di aggiornamento (aios-aggiornamento.*): i PC installati lo scaricano con
#   l'accesso dell'utente o lo leggono da una chiavetta, senza formattare;
# - a scelta la chiavetta d'installazione (ISO) e la pubblicazione su ghcr.io.
# Si avvia a mano (Actions › Immagine AIOS › Run workflow) o con un'etichetta v*.
on:
  workflow_dispatch:
    inputs:
      iso:
        description: "Crea la chiavetta d'installazione (ISO)"
        type: boolean
        default: true
      pubblica:
        description: "Pubblica l'immagine su ghcr.io (aggiornamenti incrementali dei PC)"
        type: boolean
        default: true
      kernel:
        description: "Kernel: fedora (predefinito) o lts (6.18, richiede Secure Boot disattivato)"
        type: choice
        options: [fedora, lts]
        default: fedora
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMMAGINE: ghcr.io/${{ github.repository_owner }}/aios
  ISO: ${{ github.event_name == 'push' || inputs.iso }}
  PUBBLICA: ${{ github.event_name == 'push' || inputs.pubblica }}
  KERNEL: ${{ inputs.kernel || 'fedora' }}

jobs:
  immagine:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Spazio sul disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af || true
          df -h / /mnt
      - name: Versione di Fedora
        # La più recente stabile disponibile tra quelle provate con AIOS
        run: |
          for v in 44 43; do
            if sudo skopeo inspect --raw "docker://quay.io/fedora-ostree-desktops/silverblue:$v" >/dev/null; then
              echo "FEDORA=$v" >> "$GITHUB_ENV"; echo "Fedora $v"; exit 0
            fi
          done
          echo "Nessuna immagine Silverblue trovata" >&2; exit 1
      - name: Adattatori del nucleo
        # l'ultima Release «adattatori-…» (flussi Adattatori del nucleo e Vista del nucleo); se non c'è, l'immagine si fa senza
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | startswith("adattatori-"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir image/nucleo --pattern '*.gguf' --pattern SHA256SUMS
            (cd image/nucleo && sha256sum -c SHA256SUMS) && rm image/nucleo/SHA256SUMS
            echo "Nucleo: $tag"; ls -lh image/nucleo
          else
            echo "::notice::nessun adattatore pubblicato: Nova userà Tev1"
          fi
      - name: Laya
        # l'ultima Release «laya-N» (flusso Laya: pubblica solo se migliora); se non c'è, decide Tev1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | startswith("laya-"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir /tmp/laya --pattern laya-nova.tar.gz --pattern SHA256SUMS
            (cd /tmp/laya && sha256sum -c SHA256SUMS)
            tar -xzf /tmp/laya/laya-nova.tar.gz -C image/laya && rm -rf /tmp/laya
            echo "Laya: $tag"; du -sh image/laya
          else
            echo "::notice::nessun Laya pubblicato: Nova userà Tev1"
          fi
      - name: Costruisci
        run: |
          echo "VERSIONE=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          sudo podman build --build-arg FEDORA="$FEDORA" --build-arg VERSIONE="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" \
            --build-arg REPO="$GITHUB_REPOSITORY" --build-arg KERNEL="${KERNEL:-fedora}" -t "${IMMAGINE}:${FEDORA}" -f image/Containerfile .
      - name: Strati per pacchetto
        # L'immagine divisa in strati stabili (un gruppo di pacchetti per strato, i modelli a parte): un PC
        # che si aggiorna dal registro scarica solo gli strati cambiati. Se non riesce, si tiene com'è.
        run: |
          if sudo podman run --rm --privileged --security-opt label=disable -v /var/lib/containers:/var/lib/containers \
               "${IMMAGINE}:${FEDORA}" rpm-ostree compose build-chunked-oci --bootc --format-version=1 \
               --from "${IMMAGINE}:${FEDORA}" --output "containers-storage:${IMMAGINE}:${FEDORA}-strati"; then
            sudo podman tag "${IMMAGINE}:${FEDORA}-strati" "${IMMAGINE}:${FEDORA}"
            sudo podman rmi "${IMMAGINE}:${FEDORA}-strati" || true
            sudo podman image prune -f || true
          else
            echo "::warning::divisione in strati non riuscita: l'immagine resta com'è"
          fi
          sudo podman image inspect "${IMMAGINE}:${FEDORA}" --format '{{len .RootFS.Layers}} strati'
          df -h / /mnt
      - name: Pubblica
        if: env.PUBBLICA == 'true'
        continue-on-error: true  # se il registro non risponde, il pacchetto della Release c'è comunque
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3; do sudo podman push "${IMMAGINE}:${FEDORA}" && exit 0; sleep 30; done; exit 1
      - name: Chiavetta d'installazione
        if: env.ISO == 'true'
        run: |
          sudo mkdir -p /mnt/uscita
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/config.toml:/config.toml:ro -v /mnt/uscita:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs "${IMMAGINE}:${FEDORA}"
          ls -lh /mnt/uscita/bootiso
      - name: Pacchetto di aggiornamento
        # La stessa immagine come file: i PC già installati la scaricano da qui (con l'accesso dell'utente)
        # o la leggono da una chiavetta (copilot/aios_copilot/imageupdate.py). Mai formattare per aggiornare.
        run: |
          sudo mkdir -p /mnt/uscita/aggiornamento
          sudo skopeo copy "containers-storage:${IMMAGINE}:${FEDORA}" oci-archive:/mnt/uscita/aggiornamento/aios-aggiornamento.ociarchive
          sudo chown -R "$(id -u)" /mnt/uscita
          cd /mnt/uscita/aggiornamento
          totale=$(sha256sum aios-aggiornamento.ociarchive | cut -d' ' -f1)
          split -b 1900M -d -a 1 aios-aggiornamento.ociarchive aios-aggiornamento.ociarchive.parte
          rm aios-aggiornamento.ociarchive
          python3 - "$VERSIONE" "$FEDORA" "$totale" <<'PY'
          import hashlib, json, pathlib, sys
          parti = []
          for p in sorted(pathlib.Path(".").glob("aios-aggiornamento.ociarchive.parte*"), key=lambda p: int(p.name.rsplit("parte", 1)[1])):
              parti.append({"nome": p.name, "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "dimensione": p.stat().st_size})
          pathlib.Path("aios-aggiornamento.json").write_text(json.dumps(
              {"versione": sys.argv[1], "fedora": sys.argv[2], "sha256": sys.argv[3], "parti": parti}, indent=1))
          PY
          ls -lh
      - name: Metti tutto in una Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(/mnt/uscita/aggiornamento/aios-aggiornamento.*)
          if [ "$ISO" = true ]; then
            # GitHub accetta file fino a 2 GB: se la ISO è più grande si divide in pezzi.
            cd /mnt/uscita/bootiso
            mv install.iso aios-installazione.iso
            sha256sum aios-installazione.iso > aios-installazione.iso.sha256
            if [ "$(stat -c %s aios-installazione.iso)" -gt 2000000000 ]; then
              split -b 1900M -d -a 1 aios-installazione.iso aios-installazione.iso.parte
              rm aios-installazione.iso
            fi
            files+=(/mnt/uscita/bootiso/aios-installazione.iso*)
          fi
          # Qualche volta GitHub rifiuta (403/5xx) a fine caricamento: si riprova invece di buttare la costruzione.
          tag="anteprima-${GITHUB_RUN_NUMBER}"
          for i in 1 2 3 4; do
            # Se nel frattempo il ramo è andato avanti, GitHub rifiuta (403) l'etichetta sul commit costruito:
            # dal secondo tentativo l'etichetta va sul ramo, e il commit costruito è scritto nelle note.
            target="$GITHUB_SHA"; [ "$i" -gt 1 ] && target="$GITHUB_REF_NAME"
            { cat "$GITHUB_WORKSPACE/image/RELEASE.md"; printf '\n---\nCostruita dal commit %s.\n' "$GITHUB_SHA"; } > /tmp/note.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target" --prerelease \
              --title "AIOS ${VERSIONE} (anteprima$([ "$KERNEL" = lts ] && echo ', kernel LTS 6.18'))" \
              --notes-file /tmp/note.md "${files[@]}" && exit 0
            echo "Release non creata (tentativo $i): riprovo"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            sleep $((60 * i))
          done
          exit 1
      - name: Togli le anteprime vecchie
        # Restano le ultime due: quella appena creata e la precedente (se la nuova ha un problema).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^anteprima-[0-9]*$' | sort -t- -k2 -nr | tail -n +3 | while read -r t; do
            echo "Tolgo $t"; gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
