name: Immagine AIOS

# Costruisce l'immagine AIOS per PC (image/Containerfile) e la pubblica su ghcr.io.
# Si avvia a mano (Actions › Immagine AIOS › Run workflow) o con un'etichetta v*.
on:
  workflow_dispatch:
    inputs:
      iso:
        description: "Crea anche la chiavetta d'installazione (ISO)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMMAGINE: ghcr.io/${{ github.repository_owner }}/aios

jobs:
  immagine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Spazio sul disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Costruisci
        run: sudo podman build -t "${IMMAGINE}:42" -f image/Containerfile .
      - name: Pubblica
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "${IMMAGINE}:42"
      - name: Chiavetta d'installazione
        if: ${{ inputs.iso }}
        run: |
          mkdir -p uscita
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/config.toml:/config.toml:ro -v ./uscita:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs "${IMMAGINE}:42"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.iso }}
        with:
          name: aios-installazione-iso
          path: uscita/bootiso/install.iso
